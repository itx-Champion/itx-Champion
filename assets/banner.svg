<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Muhammad Ahmad — AI Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121018"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2762b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f2762b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f5c06b"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>

    <!-- drifting lights -->
    <circle cx="230" cy="90" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="230;300;230" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;130;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="300" r="240" fill="url(#glowB)">
      <animate attributeName="cx" values="1030;960;1030" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;250;300" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- name block -->
    <text x="72" y="118" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#9aa3b2">AI ENGINEER · FULL-STACK DEVELOPER</text>
    <text x="70" y="186" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#f5f7fb">Muhammad Ahmad</text>
    <text x="72" y="228" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="url(#accent)">AI agents · RAG · MCP servers · Next.js · Postgres</text>
    <text x="72" y="262" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa3b2">I design and ship production-grade SaaS with AI features that hold up in real use.</text>

    <!-- underline that draws in -->
    <rect x="72" y="282" width="0" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;180;180" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- agent → tools graph -->
    <g transform="translate(790 60)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <!-- hub -->
      <circle cx="160" cy="110" r="44" fill="#0f141d" stroke="url(#link)" stroke-width="1.5"/>
      <circle cx="160" cy="110" r="44" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1">
        <animate attributeName="r" values="44;60;44" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text x="160" y="106" text-anchor="middle" font-size="12" fill="#c7d2fe" letter-spacing="2">AGENT</text>
      <text x="160" y="124" text-anchor="middle" font-size="11" fill="#7c8597">tool calls</text>

      <!-- spokes -->
      <g stroke="url(#link)" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M119 86 L52 46"/>
        <path d="M116 118 L30 130"/>
        <path d="M128 142 L70 196"/>
        <path d="M201 86 L268 46"/>
        <path d="M204 118 L290 130"/>
        <path d="M192 142 L250 196"/>
      </g>
      <!-- packets travelling along the spokes -->
      <g fill="#f5c06b">
        <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M119 86 L52 46"/></circle>
        <circle r="3"><animateMotion dur="3.1s" repeatCount="indefinite" begin="0.6s" path="M116 118 L30 130"/></circle>
        <circle r="3"><animateMotion dur="2.9s" repeatCount="indefinite" begin="1.2s" path="M128 142 L70 196"/></circle>
        <circle r="3"><animateMotion dur="2.7s" repeatCount="indefinite" begin="0.3s" path="M268 46 L201 86"/></circle>
        <circle r="3"><animateMotion dur="3.3s" repeatCount="indefinite" begin="1.5s" path="M290 130 L204 118"/></circle>
        <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.9s" path="M250 196 L192 142"/></circle>
      </g>

      <!-- tool nodes -->
      <g font-size="11" fill="#dbe3f0" text-anchor="middle">
        <g transform="translate(40 40)"><rect x="-38" y="-14" width="76" height="28" rx="8" fill="#141a26" stroke="#2a3344"/><text y="4">Postgres</text></g>
        <g transform="translate(14 130)"><rect x="-34" y="-14" width="68" height="28" rx="8" fill="#141a26" stroke="#2a3344"/><text y="4">RAG</text></g>
        <g transform="translate(60 206)"><rect x="-40" y="-14" width="80" height="28" rx="8" fill="#141a26" stroke="#2a3344"/><text y="4">REST API</text></g>
        <g transform="translate(284 40)"><rect x="-42" y="-14" width="84" height="28" rx="8" fill="#141a26" stroke="#2a3344"/><text y="4">MCP server</text></g>
        <g transform="translate(310 130)"><rect x="-36" y="-14" width="72" height="28" rx="8" fill="#141a26" stroke="#2a3344"/><text y="4">Claude</text></g>
        <g transform="translate(262 206)"><rect x="-42" y="-14" width="84" height="28" rx="8" fill="#141a26" stroke="#2a3344"/><text y="4">Next.js UI</text></g>
      </g>
    </g>

    <!-- frame -->
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
